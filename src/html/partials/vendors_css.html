<!-- Theme Initialization Script (Prevents Flash of Unstyled Content) -->
<script>
  (function() {
    var savedTheme = localStorage.getItem('theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = (savedTheme === 'dark' || savedTheme === 'light') ? savedTheme : (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<meta name="color-scheme" content="light dark" />
<style>
  /* Critical CSS to prevent FOUC before stylesheet finishes loading */
  :root {
      color-scheme: light dark;
      --sidebar-bg: #f8f9fa;
  }
  html[data-theme="dark"],
  html[data-theme="dark"] body {
      background-color: #282a36;
      color-scheme: dark;
  }
  [data-theme="dark"] {
      --sidebar-bg: #282a36;
  }
</style>
