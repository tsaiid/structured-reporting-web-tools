<!-- Neck Lymph Node Helper Modal -->
<dialog id="modal_neck_ln_helper" class="p-0 rounded-lg shadow-xl backdrop:bg-gray-900/50 dark:bg-gray-800 dark:text-gray-100 w-fit max-w-full">
    <div class="flex flex-col max-h-[90vh]">
        <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-xl font-semibold">
                Neck Lymph Node Map Helper
            </h3>
            <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white" onclick="document.getElementById('modal_neck_ln_helper').close()">
                <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                <span class="sr-only">Close modal</span>
            </button>
        </div>

        <div class="p-6 overflow-hidden">
            <div class="mb-4 text-sm text-gray-600 dark:text-gray-400">
                <p>Select involved lymph node stations on the map below.</p>
                <p id="neck_ln_cricoid_legend" class="mt-1 hidden"><span class="text-orange-600 dark:text-orange-400 font-medium">Orange stations</span> are below the caudal border of cricoid cartilage (N3 criteria).</p>
            </div>

            <div class="neck-ln-map-container bg-white rounded-lg shadow-inner overflow-hidden">
                <img src="../assets/images/neck_lymph_node_stations.webp" alt="Neck Lymph Node Stations" class="neck-ln-map-img">

                <!-- Right side (image left = patient right) -->
                <button type="button" class="neck-ln-station-btn ln-r-IA" data-uid="r-IA" data-station="IA" data-side="right" data-name="Submental" aria-label="Right IA - Submental" aria-pressed="false">IA</button>
                <button type="button" class="neck-ln-station-btn ln-r-IB" data-uid="r-IB" data-station="IB" data-side="right" data-name="Submandibular" aria-label="Right IB - Submandibular" aria-pressed="false">IB</button>
                <button type="button" class="neck-ln-station-btn ln-r-IIA" data-uid="r-IIA" data-station="IIA" data-side="right" data-name="Upper jugular (anterior)" aria-label="Right IIA - Upper jugular (anterior)" aria-pressed="false">IIA</button>
                <button type="button" class="neck-ln-station-btn ln-r-IIB" data-uid="r-IIB" data-station="IIB" data-side="right" data-name="Upper jugular (posterior)" aria-label="Right IIB - Upper jugular (posterior)" aria-pressed="false">IIB</button>
                <button type="button" class="neck-ln-station-btn ln-r-III" data-uid="r-III" data-station="III" data-side="right" data-name="Mid jugular" aria-label="Right III - Mid jugular" aria-pressed="false">III</button>
                <button type="button" class="neck-ln-station-btn ln-r-IVA" data-uid="r-IVA" data-station="IVA" data-side="right" data-name="Lower jugular" aria-label="Right IVA - Lower jugular" aria-pressed="false">IVA</button>
                <button type="button" class="neck-ln-station-btn ln-r-IVB" data-uid="r-IVB" data-station="IVB" data-side="right" data-name="Medial supraclavicular" aria-label="Right IVB - Medial supraclavicular" aria-pressed="false">IVB</button>
                <button type="button" class="neck-ln-station-btn ln-r-VA" data-uid="r-VA" data-station="VA" data-side="right" data-name="Upper posterior triangle" aria-label="Right VA - Upper posterior triangle" aria-pressed="false">VA</button>
                <button type="button" class="neck-ln-station-btn ln-r-VB" data-uid="r-VB" data-station="VB" data-side="right" data-name="Lower posterior triangle" aria-label="Right VB - Lower posterior triangle" aria-pressed="false">VB</button>
                <button type="button" class="neck-ln-station-btn ln-r-VC" data-uid="r-VC" data-station="VC" data-side="right" data-name="Lateral supraclavicular" aria-label="Right VC - Lateral supraclavicular" aria-pressed="false">VC</button>
                <button type="button" class="neck-ln-station-btn ln-r-VI" data-uid="r-VI" data-station="VI" data-side="right" data-name="Anterior cervical" aria-label="Right VI - Anterior cervical" aria-pressed="false">VI</button>
                <button type="button" class="neck-ln-station-btn ln-r-VIIA" data-uid="r-VIIA" data-station="VIIA" data-side="right" data-name="Retropharyngeal" aria-label="Right VIIA - Retropharyngeal" aria-pressed="false">VIIA</button>
                <button type="button" class="neck-ln-station-btn ln-r-VIIB" data-uid="r-VIIB" data-station="VIIB" data-side="right" data-name="Retrostyloid" aria-label="Right VIIB - Retrostyloid" aria-pressed="false">VIIB</button>
                <button type="button" class="neck-ln-station-btn ln-r-VIII" data-uid="r-VIII" data-station="VIII" data-side="right" data-name="Parotid" aria-label="Right VIII - Parotid" aria-pressed="false">VIII</button>
                <button type="button" class="neck-ln-station-btn ln-r-IX" data-uid="r-IX" data-station="IX" data-side="right" data-name="Bucco-facial" aria-label="Right IX - Bucco-facial" aria-pressed="false">IX</button>
                <button type="button" class="neck-ln-station-btn ln-r-XA" data-uid="r-XA" data-station="XA" data-side="right" data-name="Retro-auricular" aria-label="Right XA - Retro-auricular" aria-pressed="false">XA</button>
                <button type="button" class="neck-ln-station-btn ln-r-XB" data-uid="r-XB" data-station="XB" data-side="right" data-name="Occipital" aria-label="Right XB - Occipital" aria-pressed="false">XB</button>

                <!-- Left side (image right = patient left) -->
                <button type="button" class="neck-ln-station-btn ln-l-IA" data-uid="l-IA" data-station="IA" data-side="left" data-name="Submental" aria-label="Left IA - Submental" aria-pressed="false">IA</button>
                <button type="button" class="neck-ln-station-btn ln-l-IB" data-uid="l-IB" data-station="IB" data-side="left" data-name="Submandibular" aria-label="Left IB - Submandibular" aria-pressed="false">IB</button>
                <button type="button" class="neck-ln-station-btn ln-l-IIA" data-uid="l-IIA" data-station="IIA" data-side="left" data-name="Upper jugular (anterior)" aria-label="Left IIA - Upper jugular (anterior)" aria-pressed="false">IIA</button>
                <button type="button" class="neck-ln-station-btn ln-l-IIB" data-uid="l-IIB" data-station="IIB" data-side="left" data-name="Upper jugular (posterior)" aria-label="Left IIB - Upper jugular (posterior)" aria-pressed="false">IIB</button>
                <button type="button" class="neck-ln-station-btn ln-l-III" data-uid="l-III" data-station="III" data-side="left" data-name="Mid jugular" aria-label="Left III - Mid jugular" aria-pressed="false">III</button>
                <button type="button" class="neck-ln-station-btn ln-l-IVA" data-uid="l-IVA" data-station="IVA" data-side="left" data-name="Lower jugular" aria-label="Left IVA - Lower jugular" aria-pressed="false">IVA</button>
                <button type="button" class="neck-ln-station-btn ln-l-IVB" data-uid="l-IVB" data-station="IVB" data-side="left" data-name="Medial supraclavicular" aria-label="Left IVB - Medial supraclavicular" aria-pressed="false">IVB</button>
                <button type="button" class="neck-ln-station-btn ln-l-VA" data-uid="l-VA" data-station="VA" data-side="left" data-name="Upper posterior triangle" aria-label="Left VA - Upper posterior triangle" aria-pressed="false">VA</button>
                <button type="button" class="neck-ln-station-btn ln-l-VB" data-uid="l-VB" data-station="VB" data-side="left" data-name="Lower posterior triangle" aria-label="Left VB - Lower posterior triangle" aria-pressed="false">VB</button>
                <button type="button" class="neck-ln-station-btn ln-l-VC" data-uid="l-VC" data-station="VC" data-side="left" data-name="Lateral supraclavicular" aria-label="Left VC - Lateral supraclavicular" aria-pressed="false">VC</button>
                <button type="button" class="neck-ln-station-btn ln-l-VI" data-uid="l-VI" data-station="VI" data-side="left" data-name="Anterior cervical" aria-label="Left VI - Anterior cervical" aria-pressed="false">VI</button>
                <button type="button" class="neck-ln-station-btn ln-l-VIIA" data-uid="l-VIIA" data-station="VIIA" data-side="left" data-name="Retropharyngeal" aria-label="Left VIIA - Retropharyngeal" aria-pressed="false">VIIA</button>
                <button type="button" class="neck-ln-station-btn ln-l-VIIB" data-uid="l-VIIB" data-station="VIIB" data-side="left" data-name="Retrostyloid" aria-label="Left VIIB - Retrostyloid" aria-pressed="false">VIIB</button>
                <button type="button" class="neck-ln-station-btn ln-l-VIII" data-uid="l-VIII" data-station="VIII" data-side="left" data-name="Parotid" aria-label="Left VIII - Parotid" aria-pressed="false">VIII</button>
                <button type="button" class="neck-ln-station-btn ln-l-IX" data-uid="l-IX" data-station="IX" data-side="left" data-name="Bucco-facial" aria-label="Left IX - Bucco-facial" aria-pressed="false">IX</button>
                <button type="button" class="neck-ln-station-btn ln-l-XA" data-uid="l-XA" data-station="XA" data-side="left" data-name="Retro-auricular" aria-label="Left XA - Retro-auricular" aria-pressed="false">XA</button>
                <button type="button" class="neck-ln-station-btn ln-l-XB" data-uid="l-XB" data-station="XB" data-side="left" data-name="Occipital" aria-label="Left XB - Occipital" aria-pressed="false">XB</button>
            </div>
        </div>

        <div class="flex items-center justify-end p-6 space-x-2 border-t border-gray-200 rounded-b dark:border-gray-700">
            <button id="btn_neck_ln_submit" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                Apply to Form
            </button>
            <button id="btn_neck_ln_clear" type="button" class="text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-blue-300 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
                Clear Selection
            </button>
        </div>
    </div>
</dialog>
